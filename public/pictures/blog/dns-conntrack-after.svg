<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" fill="none">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7877c6"/>
    </marker>
  </defs>
  <rect width="900" height="450" rx="12" fill="#0a0a1a"/>
  <text x="450" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">After: NodeLocal DNSCache answers on the node</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Same IP for pods (172.20.0.10), no pod or kubelet changes, most lookups never leave the node</text>

  <!-- Worker node -->
  <rect x="30" y="80" width="430" height="340" rx="10" fill="#1e293b" stroke="#7877c6" stroke-width="1.5"/>
  <text x="48" y="104" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">every worker node (DaemonSet: one cache per node)</text>
  <rect x="60" y="120" width="70" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="95" y="139" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="145" y="120" width="70" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="180" y="139" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="230" y="120" width="70" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="265" y="139" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <line x1="180" y1="150" x2="180" y2="192" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="195" y="170" fill="#cbd5e1" font-family="system-ui" font-size="11">UDP :53 → 172.20.0.10</text>
  <text x="195" y="185" fill="#94a3b8" font-family="system-ui" font-size="10">intercepted locally (iptables NOTRACK)</text>

  <rect x="55" y="195" width="380" height="88" rx="8" fill="#0f172a" stroke="#fde68a" stroke-width="1.5"/>
  <text x="245" y="222" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="600">node-local-dns (CoreDNS as a cache)</text>
  <text x="245" y="243" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">binds 169.254.20.10 and 172.20.0.10 on a dummy interface</text>
  <text x="245" y="266" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="12">cache hit (84%) → answered in &lt; 1 ms</text>

  <text x="48" y="315" fill="#86efac" font-family="system-ui" font-size="12">Hit: no packet leaves the node, nothing is tracked</text>
  <text x="48" y="340" fill="#cbd5e1" font-family="system-ui" font-size="12">Miss: one flow on this node's own, nearly empty table</text>
  <text x="48" y="365" fill="#cbd5e1" font-family="system-ui" font-size="12">DNS capacity now grows with the number of nodes,</text>
  <text x="48" y="383" fill="#cbd5e1" font-family="system-ui" font-size="12">not with one CoreDNS instance's connection table</text>

  <!-- Arrows out -->
  <line x1="437" y1="220" x2="616" y2="150" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="437" y1="262" x2="616" y2="330" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="540" y="128" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">miss: *.cluster.local</text>
  <text x="540" y="143" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">few long-lived TCP conns</text>
  <text x="545" y="342" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">miss: external names</text>
  <text x="545" y="357" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">straight to the VPC resolver</text>

  <!-- CoreDNS node -->
  <rect x="620" y="80" width="250" height="160" rx="10" fill="#1e293b" stroke="#86efac" stroke-width="1.5"/>
  <text x="640" y="104" fill="#86efac" font-family="system-ui" font-size="13" font-weight="600">CoreDNS node</text>
  <text x="640" y="126" fill="#94a3b8" font-family="system-ui" font-size="11">connection-tracking table</text>
  <rect x="640" y="134" width="210" height="18" rx="4" fill="#0a0a1a" stroke="#475569"/>
  <rect x="640" y="134" width="14" height="18" rx="4" fill="#86efac" fill-opacity="0.8"/>
  <text x="640" y="172" fill="#cbd5e1" font-family="system-ui" font-size="11">UDP DNS flows: ~33,000 → 0</text>
  <text x="640" y="192" fill="#cbd5e1" font-family="system-ui" font-size="11">TCP conns from node caches: ~450</text>
  <text x="640" y="212" fill="#cbd5e1" font-family="system-ui" font-size="11">queries reaching CoreDNS: ~10%</text>
  <text x="640" y="230" fill="#86efac" font-family="system-ui" font-size="11">dropped packets: 0</text>

  <!-- VPC resolver -->
  <rect x="620" y="300" width="250" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="640" y="326" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="600">VPC DNS resolver</text>
  <text x="640" y="348" fill="#94a3b8" font-family="system-ui" font-size="11">databases, SSO, public domains</text>
  <text x="640" y="366" fill="#94a3b8" font-family="system-ui" font-size="11">spread across every node's own ENI</text>
</svg>
