<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" fill="none">
  <rect width="900" height="300" rx="12" fill="#0a0a1a"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">Request Flow: kubectl apply → Running Pod</text>
  <!-- Steps -->
  <!-- 1. kubectl -->
  <rect x="30" y="80" width="120" height="70" rx="10" fill="#1e293b" stroke="#fde68a" stroke-width="1.5"/>
  <text x="90" y="112" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="600">kubectl</text>
  <text x="90" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">apply -f pod.yaml</text>
  <!-- Arrow -->
  <line x1="150" y1="115" x2="190" y2="115" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- 2. API Server -->
  <rect x="190" y="80" width="120" height="70" rx="10" fill="#1e293b" stroke="#fde68a" stroke-width="1.5"/>
  <text x="250" y="112" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="600">API Server</text>
  <text x="250" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Auth + Validation</text>
  <!-- Arrow -->
  <line x1="310" y1="115" x2="350" y2="115" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- 3. etcd -->
  <rect x="350" y="80" width="120" height="70" rx="10" fill="#1e293b" stroke="#86efac" stroke-width="1.5"/>
  <text x="410" y="112" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="13" font-weight="600">etcd</text>
  <text x="410" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Store desired state</text>
  <!-- Arrow -->
  <line x1="470" y1="115" x2="510" y2="115" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- 4. Scheduler -->
  <rect x="510" y="80" width="120" height="70" rx="10" fill="#1e293b" stroke="#fde68a" stroke-width="1.5"/>
  <text x="570" y="112" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="600">Scheduler</text>
  <text x="570" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Pick best node</text>
  <!-- Arrow -->
  <line x1="630" y1="115" x2="670" y2="115" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- 5. Kubelet -->
  <rect x="670" y="80" width="120" height="70" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="730" y="112" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="13" font-weight="600">Kubelet</text>
  <text x="730" y="132" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Create container</text>
  <!-- Arrow down -->
  <line x1="730" y1="150" x2="730" y2="185" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- 6. Pod Running -->
  <rect x="670" y="185" width="120" height="70" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="730" y="217" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="700">Pod Running</text>
  <text x="730" y="237" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Healthy + Ready</text>
  <!-- Step numbers -->
  <circle cx="42" cy="78" r="10" fill="#7877c6"/>
  <text x="42" y="82" text-anchor="middle" fill="white" font-family="system-ui" font-size="10" font-weight="700">1</text>
  <circle cx="202" cy="78" r="10" fill="#7877c6"/>
  <text x="202" y="82" text-anchor="middle" fill="white" font-family="system-ui" font-size="10" font-weight="700">2</text>
  <circle cx="362" cy="78" r="10" fill="#7877c6"/>
  <text x="362" y="82" text-anchor="middle" fill="white" font-family="system-ui" font-size="10" font-weight="700">3</text>
  <circle cx="522" cy="78" r="10" fill="#7877c6"/>
  <text x="522" y="82" text-anchor="middle" fill="white" font-family="system-ui" font-size="10" font-weight="700">4</text>
  <circle cx="682" cy="78" r="10" fill="#7877c6"/>
  <text x="682" y="82" text-anchor="middle" fill="white" font-family="system-ui" font-size="10" font-weight="700">5</text>
  <circle cx="682" cy="183" r="10" fill="#38bdf8"/>
  <text x="682" y="187" text-anchor="middle" fill="white" font-family="system-ui" font-size="10" font-weight="700">6</text>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7877c6"/>
    </marker>
  </defs>
</svg>
