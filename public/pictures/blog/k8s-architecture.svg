<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <rect width="900" height="500" rx="12" fill="#0a0a1a"/>
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="18" font-weight="600">Kubernetes Cluster Architecture</text>
  <!-- Control Plane Box -->
  <rect x="30" y="60" width="400" height="410" rx="10" fill="#1a1a2e" stroke="#7877c6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="230" y="90" text-anchor="middle" fill="#7877c6" font-family="system-ui" font-size="15" font-weight="600">Control Plane</text>
  <!-- API Server -->
  <rect x="60" y="110" width="160" height="55" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="140" y="143" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="500">API Server</text>
  <!-- etcd -->
  <rect x="240" y="110" width="160" height="55" rx="8" fill="#1e293b" stroke="#86efac" stroke-width="1.2"/>
  <text x="320" y="143" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="13" font-weight="500">etcd</text>
  <!-- Scheduler -->
  <rect x="60" y="185" width="160" height="55" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="140" y="218" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="500">Scheduler</text>
  <!-- Controller Manager -->
  <rect x="240" y="185" width="160" height="55" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="320" y="218" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="500">Controller Manager</text>
  <!-- Cloud Controller -->
  <rect x="150" y="260" width="160" height="55" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="230" y="285" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="500">Cloud Controller</text>
  <text x="230" y="302" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="500">Manager</text>
  <!-- Worker Node 1 -->
  <rect x="470" y="60" width="400" height="195" rx="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="670" y="90" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="15" font-weight="600">Worker Node 1</text>
  <!-- Kubelet -->
  <rect x="500" y="110" width="110" height="50" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="555" y="140" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="12" font-weight="500">Kubelet</text>
  <!-- Kube-proxy -->
  <rect x="625" y="110" width="110" height="50" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="680" y="140" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="12" font-weight="500">Kube-proxy</text>
  <!-- Container Runtime -->
  <rect x="750" y="110" width="100" height="50" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="800" y="135" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="500">Container</text>
  <text x="800" y="150" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="500">Runtime</text>
  <!-- Pod 1 -->
  <rect x="500" y="180" width="80" height="55" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="540" y="205" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod A</text>
  <rect x="515" y="215" width="50" height="14" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="540" y="226" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="8">nginx</text>
  <!-- Pod 2 -->
  <rect x="595" y="180" width="80" height="55" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="635" y="205" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod B</text>
  <rect x="610" y="215" width="50" height="14" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="635" y="226" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="8">api</text>
  <!-- Pod 3 -->
  <rect x="690" y="180" width="80" height="55" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="730" y="205" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod C</text>
  <rect x="705" y="215" width="50" height="14" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="730" y="226" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="8">redis</text>
  <!-- Worker Node 2 -->
  <rect x="470" y="275" width="400" height="195" rx="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="670" y="305" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="15" font-weight="600">Worker Node 2</text>
  <!-- Kubelet 2 -->
  <rect x="500" y="320" width="110" height="50" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="555" y="350" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="12" font-weight="500">Kubelet</text>
  <!-- Kube-proxy 2 -->
  <rect x="625" y="320" width="110" height="50" rx="8" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="680" y="350" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="12" font-weight="500">Kube-proxy</text>
  <!-- Container Runtime 2 -->
  <rect x="750" y="320" width="100" height="50" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="800" y="345" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="500">Container</text>
  <text x="800" y="360" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="500">Runtime</text>
  <!-- Pods Node 2 -->
  <rect x="500" y="390" width="80" height="55" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="540" y="415" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod D</text>
  <rect x="515" y="425" width="50" height="14" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="540" y="436" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="8">worker</text>
  <rect x="595" y="390" width="80" height="55" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="635" y="415" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod E</text>
  <rect x="610" y="425" width="50" height="14" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="635" y="436" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="8">postgres</text>
  <!-- Arrows from Control Plane to Workers -->
  <line x1="430" y1="140" x2="470" y2="140" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="350" x2="470" y2="350" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7877c6"/>
    </marker>
  </defs>
  <!-- Legend -->
  <rect x="60" y="340" width="12" height="12" rx="2" fill="#fde68a" fill-opacity="0.3" stroke="#fde68a" stroke-width="1"/>
  <text x="80" y="351" fill="#94a3b8" font-family="system-ui" font-size="10">Core Component</text>
  <rect x="60" y="360" width="12" height="12" rx="2" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="80" y="371" fill="#94a3b8" font-family="system-ui" font-size="10">Pod / Workload</text>
  <rect x="60" y="380" width="12" height="12" rx="2" fill="#a78bfa" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1"/>
  <text x="80" y="391" fill="#94a3b8" font-family="system-ui" font-size="10">Infrastructure</text>
</svg>
