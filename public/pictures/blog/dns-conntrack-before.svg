<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" fill="none">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7877c6"/>
    </marker>
  </defs>
  <rect width="900" height="440" rx="12" fill="#0a0a1a"/>
  <text x="450" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">Before: every DNS lookup crosses the network to the CoreDNS node</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Each lookup uses a new random source port, so it creates a new tracked flow on the CoreDNS node</text>

  <!-- Worker nodes -->
  <rect x="30" y="85" width="250" height="80" rx="10" fill="#1e293b" stroke="#7877c6" stroke-width="1.5"/>
  <text x="44" y="106" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">worker node</text>
  <rect x="44" y="120" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="76" y="139" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="122" y="120" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="154" y="139" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="200" y="120" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="232" y="139" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>

  <rect x="30" y="185" width="250" height="80" rx="10" fill="#1e293b" stroke="#7877c6" stroke-width="1.5"/>
  <text x="44" y="206" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">worker node</text>
  <rect x="44" y="220" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="76" y="239" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="122" y="220" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="154" y="239" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="200" y="220" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="232" y="239" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>

  <rect x="30" y="285" width="250" height="80" rx="10" fill="#1e293b" stroke="#7877c6" stroke-width="1.5"/>
  <text x="44" y="306" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">worker node</text>
  <rect x="44" y="320" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="76" y="339" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="122" y="320" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="154" y="339" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>
  <rect x="200" y="320" width="64" height="28" rx="6" fill="#0f172a" stroke="#94a3b8"/>
  <text x="232" y="339" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="11">pod</text>

  <text x="155" y="395" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">… ~100 nodes, ~7,000 lookups/sec of demand</text>

  <!-- Flows -->
  <line x1="282" y1="125" x2="516" y2="190" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="282" y1="225" x2="516" y2="215" stroke="#7877c6" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="282" y1="325" x2="516" y2="240" stroke="#7877c6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="452" y1="248" x2="472" y2="268" stroke="#f87171" stroke-width="3"/>
  <line x1="472" y1="248" x2="452" y2="268" stroke="#f87171" stroke-width="3"/>
  <text x="395" y="98" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="12">UDP :53 → 172.20.0.10</text>
  <text x="395" y="114" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">kube-proxy DNATs to a CoreDNS pod</text>
  <text x="400" y="362" text-anchor="middle" fill="#f87171" font-family="system-ui" font-size="11">dropped → client waits 5 s, retries</text>

  <!-- CoreDNS node -->
  <rect x="520" y="85" width="350" height="320" rx="10" fill="#1e293b" stroke="#fde68a" stroke-width="1.5"/>
  <text x="540" y="110" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="600">CoreDNS node (a single .large instance)</text>

  <rect x="540" y="125" width="310" height="92" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.2"/>
  <text x="555" y="146" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">EC2 connection-tracking table (hypervisor)</text>
  <rect x="555" y="158" width="280" height="20" rx="4" fill="#0a0a1a" stroke="#475569"/>
  <rect x="555" y="158" width="280" height="20" rx="4" fill="#f87171" fill-opacity="0.75"/>
  <text x="695" y="173" text-anchor="middle" fill="#0a0a1a" font-family="system-ui" font-size="11" font-weight="700">FULL</text>
  <text x="555" y="203" fill="#fca5a5" font-family="system-ui" font-size="11">conntrack_allowance_available = 0</text>

  <rect x="545" y="235" width="68" height="30" rx="6" fill="#0f172a" stroke="#86efac"/>
  <text x="579" y="255" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="11">coredns</text>
  <rect x="621" y="235" width="68" height="30" rx="6" fill="#0f172a" stroke="#86efac"/>
  <text x="655" y="255" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="11">coredns</text>
  <rect x="697" y="235" width="68" height="30" rx="6" fill="#0f172a" stroke="#86efac"/>
  <text x="731" y="255" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="11">coredns</text>
  <rect x="773" y="235" width="68" height="30" rx="6" fill="#0f172a" stroke="#86efac"/>
  <text x="807" y="255" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="11">coredns</text>

  <text x="540" y="297" fill="#fde68a" font-family="system-ui" font-size="12">~33,000 DNS flows tracked at once</text>
  <text x="540" y="322" fill="#fca5a5" font-family="system-ui" font-size="12">New flow + full table → packet dropped</text>
  <text x="540" y="342" fill="#94a3b8" font-family="system-ui" font-size="11">silently, below the OS: no kernel counter,</text>
  <text x="540" y="358" fill="#94a3b8" font-family="system-ui" font-size="11">no CoreDNS metric, no log line anywhere</text>
  <text x="540" y="386" fill="#94a3b8" font-family="system-ui" font-size="11">CoreDNS itself looks healthy (p99 1.8 ms)</text>
</svg>
