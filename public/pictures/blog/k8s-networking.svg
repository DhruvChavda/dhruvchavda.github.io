<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <rect width="900" height="400" rx="12" fill="#0a0a1a"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">Kubernetes Networking: Service Types</text>
  <!-- ClusterIP -->
  <rect x="30" y="60" width="260" height="310" rx="10" fill="#1a1a2e" stroke="#7877c6" stroke-width="1"/>
  <text x="160" y="90" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="14" font-weight="600">ClusterIP (default)</text>
  <text x="160" y="115" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Internal cluster access only</text>
  <rect x="60" y="135" width="200" height="45" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="160" y="163" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="12">Service: 10.96.0.1:80</text>
  <line x1="110" y1="180" x2="110" y2="210" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="210" y1="180" x2="210" y2="210" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="60" y="210" width="90" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="235" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod A</text>
  <rect x="165" y="210" width="90" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="210" y="235" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod B</text>
  <rect x="60" y="270" width="200" height="35" rx="6" fill="#4ade80" fill-opacity="0.1" stroke="#4ade80" stroke-width="1"/>
  <text x="160" y="292" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="11">Only reachable inside cluster</text>
  <!-- NodePort -->
  <rect x="320" y="60" width="260" height="310" rx="10" fill="#1a1a2e" stroke="#7877c6" stroke-width="1"/>
  <text x="450" y="90" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="14" font-weight="600">NodePort</text>
  <text x="450" y="115" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Exposes on each node's IP</text>
  <rect x="350" y="135" width="200" height="45" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
  <text x="450" y="155" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="12">Node IP:30080</text>
  <text x="450" y="170" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Port range: 30000-32767</text>
  <line x1="450" y1="180" x2="450" y2="195" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="370" y="195" width="160" height="35" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="450" y="217" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11">ClusterIP Service</text>
  <line x1="410" y1="230" x2="410" y2="260" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="490" y1="230" x2="490" y2="260" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="365" y="260" width="80" height="35" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="405" y="282" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod A</text>
  <rect x="455" y="260" width="80" height="35" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="495" y="282" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod B</text>
  <rect x="350" y="310" width="200" height="35" rx="6" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-width="1"/>
  <text x="450" y="332" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="11">Reachable via node IP + port</text>
  <!-- LoadBalancer -->
  <rect x="610" y="60" width="260" height="310" rx="10" fill="#1a1a2e" stroke="#7877c6" stroke-width="1"/>
  <text x="740" y="90" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="14" font-weight="600">LoadBalancer</text>
  <text x="740" y="115" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Cloud provider external LB</text>
  <rect x="645" y="135" width="190" height="35" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="740" y="157" text-anchor="middle" fill="#ec4899" font-family="system-ui" font-size="12">External IP: 34.x.x.x:80</text>
  <line x1="740" y1="170" x2="740" y2="185" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="660" y="185" width="160" height="30" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
  <text x="740" y="205" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="11">NodePort</text>
  <line x1="740" y1="215" x2="740" y2="230" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="660" y="230" width="160" height="30" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="740" y="250" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11">ClusterIP</text>
  <line x1="700" y1="260" x2="700" y2="280" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="780" y1="260" x2="780" y2="280" stroke="#4ade80" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="660" y="280" width="70" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="695" y="300" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod A</text>
  <rect x="740" y="280" width="70" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="775" y="300" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11">Pod B</text>
  <rect x="640" y="325" width="200" height="35" rx="6" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1"/>
  <text x="740" y="347" text-anchor="middle" fill="#ec4899" font-family="system-ui" font-size="11">Reachable from the internet</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
</svg>
