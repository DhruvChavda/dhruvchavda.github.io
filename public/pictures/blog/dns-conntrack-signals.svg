<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none">
  <rect width="900" height="420" rx="12" fill="#0a0a1a"/>
  <text x="450" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">Where the packets died, and which signals could see it</text>
  <text x="300" y="62" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11" letter-spacing="1">LAYER</text>
  <text x="745" y="62" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11" letter-spacing="1">WHAT IT TOLD US</text>

  <!-- L1 -->
  <rect x="40" y="75" width="520" height="62" rx="10" fill="#1e293b" stroke="#fde68a" stroke-width="1.2"/>
  <text x="60" y="101" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Application logs (Grafana)</text>
  <text x="60" y="122" fill="#94a3b8" font-family="system-ui" font-size="11">lookup … i/o timeout: 1–3 per hour, then occasional bursts</text>
  <rect x="620" y="85" width="250" height="42" rx="8" fill="#0f172a" stroke="#fde68a"/>
  <text x="745" y="111" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="12">Something's off… but rarely</text>

  <!-- L2 -->
  <rect x="40" y="150" width="520" height="62" rx="10" fill="#1e293b" stroke="#86efac" stroke-width="1.2"/>
  <text x="60" y="176" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">CoreDNS metrics</text>
  <text x="60" y="197" fill="#94a3b8" font-family="system-ui" font-size="11">p99 latency 1.8 ms, request rate rock-steady, no SERVFAIL spike</text>
  <rect x="620" y="160" width="250" height="42" rx="8" fill="#0f172a" stroke="#86efac"/>
  <text x="745" y="186" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="12">Looks perfect ✓ (it wasn't)</text>

  <!-- L3 -->
  <rect x="40" y="225" width="520" height="62" rx="10" fill="#1e293b" stroke="#86efac" stroke-width="1.2"/>
  <text x="60" y="251" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Linux kernel on the node</text>
  <text x="60" y="272" fill="#94a3b8" font-family="system-ui" font-size="11">nf_conntrack drops 0 · NIC drops 0 · UDP buffer errors 0</text>
  <rect x="620" y="235" width="250" height="42" rx="8" fill="#0f172a" stroke="#86efac"/>
  <text x="745" y="261" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="12">All zeros ✓ (blind to it)</text>

  <!-- L4 -->
  <rect x="40" y="300" width="520" height="62" rx="10" fill="#2a1416" stroke="#f87171" stroke-width="1.8"/>
  <text x="60" y="326" fill="#fca5a5" font-family="system-ui" font-size="13" font-weight="600">EC2 hypervisor (Nitro): connection tracking</text>
  <text x="60" y="347" fill="#fca5a5" font-family="system-ui" font-size="11">ethtool -S ens5 → conntrack_allowance_exceeded: 84,469,253</text>
  <circle cx="530" cy="331" r="14" fill="#f87171"/>
  <line x1="523" y1="324" x2="537" y2="338" stroke="#0a0a1a" stroke-width="3"/>
  <line x1="537" y1="324" x2="523" y2="338" stroke="#0a0a1a" stroke-width="3"/>
  <rect x="620" y="310" width="250" height="42" rx="8" fill="#0f172a" stroke="#f87171"/>
  <text x="745" y="336" text-anchor="middle" fill="#fca5a5" font-family="system-ui" font-size="12" font-weight="600">The truth: packets dropped here</text>

  <text x="450" y="395" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">The drops happen below the operating system, so nothing the kernel, CoreDNS or the app reports can see them.</text>
</svg>
